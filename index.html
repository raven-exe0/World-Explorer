<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="country.css">
   <link href="https://fonts.googleapis.com/css2?family=Fredericka+the+Great&display=swap" rel="stylesheet">
   <link href="https://fonts.googleapis.com/css2?family=Rubik+Iso&display=swap" rel="stylesheet">
   <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css" />

   <title>World Explorer — Explore Countries, Maps & Facts</title>

   <meta name="description" content="Explore countries around the world with flags, maps, capitals, languages, currencies, populations, borders and more.">
   <meta name="robot" content="index, follow">
   <link rel="canonical" href="https://raven-exe0.github.io/World-Explorer/">

</head>

<body>
   <div class="spin"></div>
   <button class="music" title="music on/off" id="mscButton">🎵</button>

   <audio id="msc" src="palace.mp3" autoplay loop></audio>
   <div id="loadingScreen">
      <div class="loadingContent">
         <div class="box-of-star1">
            <div class="star star-position1"></div>
            <div class="star star-position2"></div>
            <div class="star star-position3"></div>
            <div class="star star-position4"></div>
            <div class="star star-position5"></div>
            <div class="star star-position6"></div>
            <div class="star star-position7"></div>
         </div>
         <div class="box-of-star2">
            <div class="star star-position1"></div>
            <div class="star star-position2"></div>
            <div class="star star-position3"></div>
            <div class="star star-position4"></div>
            <div class="star star-position5"></div>
            <div class="star star-position6"></div>
            <div class="star star-position7"></div>
         </div>
         <div class="box-of-star3">
            <div class="star star-position1"></div>
            <div class="star star-position2"></div>
            <div class="star star-position3"></div>
            <div class="star star-position4"></div>
            <div class="star star-position5"></div>
            <div class="star star-position6"></div>
            <div class="star star-position7"></div>
         </div>
         <div class="box-of-star4">
            <div class="star star-position1"></div>
            <div class="star star-position2"></div>
            <div class="star star-position3"></div>
            <div class="star star-position4"></div>
            <div class="star star-position5"></div>
            <div class="star star-position6"></div>
            <div class="star star-position7"></div>
         </div>
         <div data-js="astro" class="astronaut">
            <div class="head"></div>
            <div class="arm arm-left"></div>
            <div class="arm arm-right"></div>
            <div class="body">
               <div class="panel"></div>
            </div>
            <div class="leg leg-left"></div>
            <div class="leg leg-right"></div>
            <div class="schoolbag"></div>
         </div>
         <h2>LOADING...</h2>
         <p>Preparing your journey around the world 🗺️</p>
         <div class="loaderBar"></div>
      </div>
   </div>
   <div id="app">


      <div id="astronautViz"></div>
      <div class="hud-frame">
         <svg viewBox="0 0 70 100">
            <path d="M 0 0 L 0 80 L 20 100 L 60 100" />
         </svg>
         <svg viewBox="0 0 70 100">
            <path d="M 70 0 L 70 80 L 50 100 L 10 100" />
         </svg>
         <svg viewBox="0 0 70 100">
            <path d="M 0 100 L 0 20 L 20 0 L 60 0" />
         </svg>
         <svg viewBox="0 0 70 100">
            <path d="M 70 100 L 70 20 L 50 0 L 10 0" />
         </svg>
      </div>
      <div id="globeViz"></div>


      <div class="page-content">

         <div class="container">

            <h1 class="titleOne"><img class="satellite" src="satellite.gif" alt=""></span>WORLD EXPLORER<img
                  class="satellite" src="satellite.gif"></h1>
            <h2 class="titleTwo">
               <span class="line"></span>
               <span class="subtitleText">Beyond borders&nbsp;|&nbsp;discover more</span>
               <span class="line"></span>
            </h2>
         </div>

         <form class="searchForm">
            <div class="searchWrapper">
               <span class="searchIcon">🔍︎</span>
               <input class="searchInput" placeholder="search country" type="text" list="countriesList"
                  autocomplete="off">
            </div>
            <datalist id="countriesList"></datalist>
            <button type="submit" class="searchButton">Search</button>
         </form>
         <div class="infos">
            <div class="countryNum">
               <div class="blueInfo">
                  <img src="maps.png">

                  <p id="blue">+195</p>
               </div>
               <p id="word">Countries</p>
            </div>
            <div class="populationNum">
               <div class="blueInfo">
                  <img src="people.png">

                  <p id="blue">+7.9 B</p>
               </div>
               <p id="word">Population</p>
            </div>
            <div class="regionNum">
               <div class="blueInfo">
                  <img src="region.png">

                  <p id="blue">+250</p>
               </div>
               <p id="word">Regions</p>
            </div>
            <div class="unlimited">
               <div class="blueInfo">
                  <img src="direction.png">
                  <p id="blue">UNLIMITED</p>
               </div>
               <p id="word">Adventures</p>
            </div>
         </div>

         <button class="locationButton">
            <div class="loader"></div><span>see location</span>
         </button>

         <div class="countryCard">
            <div class="cardContent">

               <form class="firstPart">

                  <div class="firstRow">

                     <img src="" alt="country flag" class="img">
                     <div class="countryName">
                        <h2 class="h2name"></h2>
                        <p class="native"></p>
                     </div>

                  </div>

                  <div class="time">


                     <h1 class="h1time"></h1>

                  </div>

               </form>

               <div class="theRest">


                  <div class="separator"></div>


               </div>

            </div>
         </div>
         <div class="footer">
            <h3>ᴍᴀᴅᴇ ᴡɪᴛʜ ♡ ʙʏ
               <a href="https://github.com/raven-exe0" target="_blank" rel="noopener noreferrer" class="btn-github">
                  <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                     <path
                        d="M7.99992 1.33331C7.12444 1.33331 6.25753 1.50575 5.4487 1.84078C4.63986 2.17581 3.90493 2.66688 3.28587 3.28593C2.03563 4.53618 1.33325 6.23187 1.33325 7.99998C1.33325 10.9466 3.24659 13.4466 5.89325 14.3333C6.22659 14.3866 6.33325 14.18 6.33325 14C6.33325 13.8466 6.33325 13.4266 6.33325 12.8733C4.48659 13.2733 4.09325 11.98 4.09325 11.98C3.78659 11.2066 3.35325 11 3.35325 11C2.74659 10.5866 3.39992 10.6 3.39992 10.6C4.06659 10.6466 4.41992 11.2866 4.41992 11.2866C4.99992 12.3 5.97992 12 6.35992 11.84C6.41992 11.4066 6.59325 11.1133 6.77992 10.9466C5.29992 10.78 3.74659 10.2066 3.74659 7.66665C3.74659 6.92665 3.99992 6.33331 4.43325 5.85998C4.36659 5.69331 4.13325 4.99998 4.49992 4.09998C4.49992 4.09998 5.05992 3.91998 6.33325 4.77998C6.85992 4.63331 7.43325 4.55998 7.99992 4.55998C8.56659 4.55998 9.13992 4.63331 9.66659 4.77998C10.9399 3.91998 11.4999 4.09998 11.4999 4.09998C11.8666 4.99998 11.6333 5.69331 11.5666 5.85998C11.9999 6.33331 12.2533 6.92665 12.2533 7.66665C12.2533 10.2133 10.6933 10.7733 9.20659 10.94C9.44659 11.1466 9.66659 11.5533 9.66659 12.1733C9.66659 13.0666 9.66659 13.7866 9.66659 14C9.66659 14.18 9.77325 14.3933 10.1133 14.3333C12.7599 13.44 14.6666 10.9466 14.6666 7.99998C14.6666 7.1245 14.4941 6.25759 14.1591 5.44876C13.8241 4.63992 13.333 3.90499 12.714 3.28593C12.0949 2.66688 11.36 2.17581 10.5511 1.84078C9.7423 1.50575 8.8754 1.33331 7.99992 1.33331V1.33331Z"
                        fill="currentcolor"></path>
                  </svg>
                  <span>Raven.exe</span>
               </a>
            </h3>
            <p>© 2026 World Explorer. All rights reserved.</p>
         </div>
         <script src="https://unpkg.com/globe.gl/dist/globe.gl.min.js"></script>
         <script type="module" src="country.js"></script>
         <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
         <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.2/color-thief.umd.js"></script>

         <script>AOS.init();</script>

      </div>

</body>

</html>
